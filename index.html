<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="style.css">
  <title>Expense Tracker</title>
</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>
    <div class="form-container">
      <form id="expense-form">
        <label for="description">Description:</label>
        <input type="text" id="description" required>
        <label for="amount">Amount:</label>
        <input type="number" id="amount" required>
        <label for="category">Category:</label>
        <select id="category" required>
          <option value="">Select a category</option>
          <option value="Food">Food</option>
          <option value="Transportation">Transportation</option>
          <option value="Housing">Housing</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Miscellaneous">Miscellaneous</option>
        </select>
        <input type="submit" value="Add Expense">
      </form>
    </div>

    <div class="form-container" style="display: none;" id="edit-form-container">
      <form id="edit-form">
        <label for="edit-description">Description:</label>
        <input type="text" id="edit-description" required>
        <label for="edit-amount">Amount:</label>
        <input type="number" id="edit-amount" required>
        <label for="edit-category">Category:</label>
        <select id="edit-category" required>
          <option value="">Select a category</option>
          <option value="Food">Food</option>
          <option value="Transportation">Transportation</option>
          <option value="Housing">Housing</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Miscellaneous">Miscellaneous</option>
        </select>
        <input type="submit" value="Update Expense">
      </form>
    </div>

    <h2>Expenses:</h2>
    <ul id="expenses"></ul>

    <div class="flex-container">
      <div class="total-container">
        <h2>Total: <span id="total-amount">Rs0.00</span></h2>
      </div>
      <div class="category-breakdown-container">
        <h2>Category Breakdown:</h2>
        <ul id="category-breakdown"></ul>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
